# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    target-branch: "pre-prod"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    groups:
      # Group all updates into a single PR instead of individually
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint declares `typescript: ">=4.8.4 <6.1.0"` and hard-errors
      # ("typescript-eslint does not support TS 7.0") on anything newer, which
      # fails `pnpm lint` in CI. Hold TypeScript on 6.0.x — patch updates only —
      # until typescript-eslint ships TS >=6.1 support.
      # Tracking: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Remove this block once typescript-eslint's peer range covers the new major.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
